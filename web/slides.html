<script>
var SL=[
{p:"Part 0 · Opening",t:"Title",h:"<h1>Writing Architecture Documentation with arc42</h1><p class='m'>A one-day beginner workshop</p><p>By 17:00 you will have a first-draft arc42 for a real system and a method you can reuse.</p>"},
{t:"Why we need this",h:"<h2>Why we need this</h2><ul><li><span class='k'>Knowledge lives in heads.</span> Newcomers wait for someone to explain.</li><li><span class='k'>Decisions are forgotten.</span> Teams re-debate old choices or break them by accident.</li><li><span class='k'>Qualities go unstated.</span> “Fast” and “secure” mean different things to different people.</li><li><span class='k'>Machines are now readers.</span> AI tools act on what is written and guess what isn’t.</li></ul>",n:"Ask: which of these have you lived through?"},
{t:"Learning outcomes",h:"<h2>By the end of today you can</h2><ul><li>Explain what software architecture and arc42 are</li><li>Identify stakeholders and write measurable quality goals</li><li>Draw a context view and a Level-1 building-block view, and write one component contract</li><li>Describe a runtime scenario and a deployment view</li><li>Record one decision as an ADR</li><li>Use AI to draft sections, then find and fix its mistakes</li></ul>"},
{t:"How we will learn",h:"<h2>How we will learn</h2><p>Each part follows one loop:</p><p class='k'>Why, what goes in and out, steps, worked example, try it, check.</p><p>I do, then we do, then you do.</p><div class='xp'><b>Experienced?</b> Try each exercise first, then compare with the example. Finished examples help most when a topic is new to you.</div><p class='src'>Basis: worked-example and expertise-reversal research (Renkl and Atkinson, 2003; Kalyuga et al., 2003).</p>",n:"Novices learn well from finished examples with support that fades as they gain skill. For people with prior knowledge the same examples can slow learning (the expertise reversal effect), so invite experienced participants to attempt first. A rough but complete skeleton beats a polished but partial one."},
{t:"Rules for AI today",h:"<h2>Rules for AI today</h2><ol><li><span class='k'>Human draft first</span> (Exercises 1–11)</li><li><span class='k'>AI second:</span> ask it why and what’s missing, not only “write it”</li><li><span class='k'>You decide:</span> every AI line gets a human verdict</li></ol><div class='xp'>In a randomized trial of 52 mostly junior engineers learning a new library, AI assistance lowered quiz scores by about 17 points. Those who asked conceptual questions did far better than those who delegated the code.</div><p class='src'>Shen and Tamkin, Anthropic, January 2026. A single small study; treat it as a signal, not a verdict.</p>",n:"Anthropic funded and ran the study. It covered one Python library and short tasks. Participants who asked conceptual questions scored well; those who delegated generation scored poorly. Full study: anthropic.com/research/AI-assistance-coding-skills"},
{t:"Teams and cases",h:"<h2>Form teams, choose your case</h2><ul><li>Teams of 3–4</li><li>Pick one system your team can explain from memory</li></ul><p class='m'>School library lending · Clinic appointment booking · Maxi-taxi arrival tracker · Community fundraising platform · Your own</p><p>Write on your team card: system name, one-sentence purpose, three likely users.</p>",n:"Doubles-to-Go is reserved as the facilitator’s worked example; teams should choose a different system."},
{t:"Set up",h:"<h2>Set up (5 min)</h2><ol><li>Create <span class='k'>arc42-team.md</span></li><li>Paste the skeleton from the student guide</li><li>Paste the Mermaid sample and confirm it renders</li><li>Share the file with your team</li></ol><p class='m'>Then take the baseline quiz: 8 questions, ungraded. You’ll retake it at the end.</p>",n:"Any Markdown editor with Mermaid preview, a repository or a shared doc works."},
{p:"Part 1 · Foundations",t:"What is architecture?",h:"<h2>What is software architecture?</h2><p>The significant decisions about how a system is organised: its main parts, how they connect, the qualities it must achieve, and the rules that keep it coherent.</p><p class='k'>“Significant” means costly to change later.</p><p class='m'>Structure · Qualities · Decisions</p>",n:"Ask for one hard-to-change choice from the room: database, language, one app or many."},
{t:"Architecture, design, code",h:"<h2>Architecture, design, code</h2><table><tr><th>Level</th><th>Example question</th><th>Who cares</th></tr><tr><td>Architecture</td><td>Do orders go through a queue or direct calls?</td><td>Whole team, operators</td></tr><tr><td>Design</td><td>How should the Order class be structured?</td><td>Developers of that part</td></tr><tr><td>Code</td><td>Which loop checks stock?</td><td>Whoever edits that file</td></tr></table><p class='k'>Architecture decisions affect many parts. Design and code decisions affect one.</p>"},
{t:"Trade-offs",h:"<h2>Architecture is trade-offs</h2><table><tr><th>Decision</th><th>Gains</th><th>Costs</th></tr><tr><td>Cache data on the phone</td><td>Faster screens</td><td>Data may be stale</td></tr><tr><td>Queue payment confirmations</td><td>Survives outages</td><td>Slight delay, more parts</td></tr><tr><td>One big application</td><td>Simple to deploy</td><td>Harder to scale parts</td></tr></table><p class='k'>Every decision gains one quality and costs another.</p>"},
{t:"What good docs are",h:"<h2>What good documentation is</h2><p>✗ A complete design spec written once up front</p><p>✗ A copy of the code in prose</p><p>✗ A document nobody updates</p><p class='k'>✓ Write down what is hard to see in the code: boundaries, qualities, decisions, reasons.</p>"},
{t:"Machines are readers too",h:"<h2>Machines are readers too</h2><ul><li>Coding agents follow the context files you give them</li><li><span class='k'>Auto-generated files</span> tended to lower success and raised cost by over 20% in one 2026 study</li><li><span class='k'>Developer-written files</span> helped a little, but still cost more</li><li>Lesson: write only what the code can’t tell, and keep it short</li></ul><p class='src'>Gloaguen et al., ETH Zurich, February 2026, arXiv:2602.11988 (preprint). Tested on Python repositories; results may differ elsewhere.</p>",n:"Nuance: when the repositories’ other documentation was removed, generated files did help. They mostly compensate for missing docs. So good documentation comes first, and agent files stay minimal."},
{t:"Stakeholders",h:"<h2>Stakeholders and concerns</h2><p><span class='k'>Stakeholder:</span> a person, group or organisation with an interest in the system.</p><p><span class='k'>Concern:</span> something a stakeholder cares about, such as “Can I recover a lost order?” or “Can I deploy on Friday?”</p><p class='m'>If nobody has a concern about it, don’t document it.</p>"},
{t:"Views and viewpoints",h:"<h2>Views and viewpoints</h2><p><span class='k'>View:</span> a representation of the system that answers a set of concerns.</p><p><span class='k'>Viewpoint:</span> the convention for such views: what to show and in which notation.</p><p class='m'>A city has a road map, a metro map and a utilities map. Same city, different maps for different people.</p><p>arc42’s sections are in effect a ready-made set of views plus supporting text. ISO/IEC/IEEE 42010 formalises these ideas.</p>"},
{t:"Zoom levels",h:"<h2>Zoom levels (the C4 idea)</h2><table><tr><th>Level</th><th>Shows</th></tr><tr><td>1 Context</td><td>The system as one box, with people and systems around it</td></tr><tr><td>2 Containers</td><td>Runnable or deployable pieces</td></tr><tr><td>3 Components</td><td>Inside one container</td></tr><tr><td>4 Code</td><td>Rarely documented</td></tr></table>"},
{t:"Container vs component",h:"<h2>Two words that confuse beginners</h2><p><span class='k'>Container:</span> a runtime thing you start, such as an application or a data store. Not necessarily Docker.</p><p><span class='k'>Component:</span> a grouping of related functionality behind a defined interface, inside a container.</p><p class='m'>arc42 is notation-neutral. Today: arc42 Level 1 ≈ containers and main blocks, Level 2 ≈ components.</p>"},
{t:"What is arc42?",h:"<h2>What is arc42?</h2><ul><li>A free, open-source template for architecture documentation</li><li>Created by Gernot Starke and Peter Hruschka</li><li>A structure, not a method: you still do the architecture</li><li>Not all 12 sections are mandatory. Size it to your system.</li></ul>"},
{t:"The 12 sections",h:"<h2>The 12 sections</h2><div class='g'><div><b>1</b>Goals</div><div><b>2</b>Constraints</div><div><b>3</b>Context</div><div><b>4</b>Strategy</div><div><b>5</b>Building blocks</div><div><b>6</b>Runtime</div><div><b>7</b>Deployment</div><div><b>8</b>Crosscutting concepts</div><div><b>9</b>Decisions</div><div><b>10</b>Quality</div><div><b>11</b>Risks and debt</div><div><b>12</b>Glossary</div></div><p class='m'>Goals and constraints shape strategy; strategy shapes structure; decisions explain the choices.</p>"},
{t:"How the sections connect",h:"@@conn@@",n:"Goals and constraints shape the strategy. The strategy guides the building blocks, which are framed by the context. Behaviour, placement and shared rules follow from the blocks. Decisions explain the strategy, and quality scenarios test the goals. Section 11 risks track what could go wrong across all of it. Get section 1 wrong and everything downstream drifts."},
{t:"Meet Doubles-to-Go",h:"<h2>Our running example: Doubles-to-Go</h2><p>A web app where customers in Trinidad pre-order doubles and other street food from nearby vendors, pay online and collect without queuing.</p><ul><li>Users: customers (phone, often 3G) and vendors (phone, busy hands)</li><li>Assumed scale: about 200 vendors, 20,000 customers, lunchtime peak</li><li>Neighbours: payment provider, SMS gateway</li></ul><p class='m'>You’ll see it documented section by section. Then you do the same for your own system.</p>"},
{e:10,t:"Warm-up",h:"<h2>Warm-up (10 min)</h2><ol><li>Draw You → Your phone → Messaging app as a Mermaid graph, with one labelled arrow</li><li>Write a 3-row Markdown table of your team’s names and roles</li></ol><p class='k'>Done when both render without errors.</p><div class='xp'><b>Experienced?</b> Add a sequence diagram of one real flow from your own system.</div>"},
{e:5,t:"Five questions",h:"<h2>Five questions (5 min)</h2><ol><li>What is a stakeholder? A concern?</li><li>Name two views of the same system</li><li>Is a Docker image a “container” in C4 terms?</li><li>Which arc42 section answers “what can’t we change?”</li><li>Give one trade-off from your own work</li></ol>"},
{p:"Break",t:"Break",h:"<h1>Break</h1><p class='m'>Back at 10:20 for Part 2: goals, quality and stakeholders.</p>"},
{p:"Part 2 · §1 Goals",t:"Part 2: Introduction and goals",h:"<p class='m'>Part 2 · 10:20 to 11:10</p><h1>§1 Introduction and goals</h1><p>Why it exists, what matters most, and who cares.</p>"},
{t:"§1 purpose and parts",h:"<h2>§1: one picture for every reader</h2><table><tr><th>Part</th><th>Content</th></tr><tr><td>1.1 Requirements overview</td><td>What it does, why, what it replaces</td></tr><tr><td>1.2 Quality goals</td><td>Top 3 (max 5) qualities for the architecture</td></tr><tr><td>1.3 Stakeholders</td><td>Who, and what they expect</td></tr></table><p class='m'>Quality goals are for the architecture, not project goals.</p>",n:"Get §1 wrong and everything downstream drifts."},
{t:"1.1 Requirements overview",h:"<h2>1.1 Requirements overview</h2><p><span class='k'>Include:</span> what the system is for, 3–7 key functions, why now, what it replaces, a link to the full requirements.</p><p><span class='k'>Leave out:</span> technology names, diagrams, component detail.</p><p class='k'>Test: a newcomer can say in 30 seconds what it is for.</p>"},
{t:"Example: Doubles-to-Go 1.1",h:"<h2>Example: Doubles-to-Go</h2><p>Lets customers order from nearby street vendors on their phone, pay online and collect without queuing. It replaces phone calls, WhatsApp messages and cash-only queues, which lose orders at peak lunchtime.</p><p class='m'>Key functions: browse vendors · place and pay for an order · SMS when ready · vendor stock and menu management · daily payout report</p>",n:"Contrast with the weak version: “A scalable, robust, cloud-native platform.”"},
{t:"Quality goals: the idea",h:"<h2>Quality goals</h2><ul><li><span class='k'>Functional:</span> what it does. <span class='k'>Quality:</span> how well.</li><li>Qualities shape architecture more than features do. A very fast system and a very cheap one are built differently.</li><li>You can’t maximise everything, so choose three.</li></ul><p class='m'>“Launch by June” is a project goal or a constraint, not a quality goal.</p>"},
{t:"Why adjectives fail",h:"<h2>Numbers beat adjectives</h2><table><tr><th>Vague</th><th>Measurable</th></tr><tr><td>“Should be fast.”</td><td>95% of order confirmations appear within 3 s at 300 orders per minute.</td></tr></table><p>“Fast”, “secure” and “easy” can’t be tested. A scenario makes them verifiable.</p>"},
{t:"Scenario anatomy",h:"<h2>Scenario: short form first</h2><p class='k'>Stimulus → Response → Metric</p><p>Long form (SEI): source, stimulus, environment, artifact, response, response measure.</p><p class='m'>Types: usage, change, failure. Don’t force all six parts when some are obvious.</p>"},
{t:"Example quality goals",h:"<h2>Doubles-to-Go quality goals</h2><table><tr><th>Goal</th><th>Scenario</th></tr><tr><td>#reliable</td><td>Connection drops during payment: on reconnect, exactly one order and one charge exist (1,000 simulated drops)</td></tr><tr><td>#usable</td><td>First-time customer on a low-end phone over 3G orders in under 90 s without help (9 of 10 users)</td></tr><tr><td>#secure</td><td>Security scan finds zero stored card numbers</td></tr></table>"},
{t:"Choose your top 3",h:"<h2>How to choose your top 3</h2><ol><li>List 6–8 candidate qualities</li><li>Ask: if we had to sacrifice it, would stakeholders object?</li><li>Prefer qualities that are expensive to fix later</li><li>Rank by stakeholder importance, keep three</li><li>Write each as #label plus one sentence</li></ol>"},
{e:5,t:"Check: fix these four",h:"<h2>Fix these four (pairs, 5 min)</h2><p>Rewrite each as a scenario with a number:</p><ol><li>“The app should be fast.”</li><li>“It must be secure.”</li><li>“Easy to maintain.”</li><li>“Highly available.”</li></ol>",n:"Sample answers: (1) 95% of pages load in under 2 s on 3G. (2) An unauthenticated request to any order endpoint is rejected 100% of the time. (3) A new payment provider can be added by one developer within 5 days. (4) Orders can be placed in 99.5% of lunch hours per month."},
{t:"Stakeholders",h:"<h2>1.3 Stakeholders</h2><p>A stakeholder is not the same as a user: also owners, operators, support, developers, auditors, suppliers.</p><p>Walk the system’s life and ask who touches it: <span class='k'>use, buy, run, support, build, audit, supply.</span></p><p class='k'>For each: what would make them unhappy? That is the expectation.</p>"},
{t:"Example stakeholders",h:"<h2>Doubles-to-Go stakeholders</h2><table><tr><td>Customers</td><td>Order quickly; never lose money or orders</td></tr><tr><td>Vendors</td><td>Simple phone UI; payout accuracy</td></tr><tr><td>Business owner</td><td>Growth, low running cost</td></tr><tr><td>Payment provider</td><td>Correct, compliant use of its API</td></tr><tr><td>Support staff</td><td>Diagnose a failed order in minutes</td></tr><tr><td>Developers (4)</td><td>Understand and change the system safely</td></tr></table>"},
{e:25,t:"Exercise 1",h:"<h2>Exercise 1: write §1 (25 min)</h2><ul><li><span class='k'>1.1</span> (5 min): one paragraph and 3–5 key functions</li><li><span class='k'>1.3</span> (8 min): 5–6 stakeholders with expectations</li><li><span class='k'>1.2</span> (12 min): top 3 goals, one short-form scenario each</li></ul><p class='m'>Output: one page in arc42-team.md</p><div class='xp'><b>Experienced?</b> Draft all three parts for a real system first, then compare with the example and the peer checklist.</div>"},
{e:5,t:"Peer review: §1",h:"<h2>Peer review (5 min)</h2><p>Swap with another team and tick:</p><ul><li>1.1 says what it replaces, with no technology names</li><li>3–5 quality goals, none a project goal</li><li>Every scenario has a number</li><li>Every stakeholder has an expectation</li><li>Each goal traces to a stakeholder</li></ul>"},
{p:"Part 3 · §2 Constraints",t:"Part 3: Constraints",h:"<p class='m'>Part 3 · 11:10 to 11:25</p><h1>§2 Constraints</h1><p>What can’t we change?</p>"},
{t:"Constraint, decision, requirement",h:"<h2>Constraint, decision or requirement?</h2><table><tr><th></th><th>Constraint</th><th>Decision</th><th>Requirement</th></tr><tr><td>Set by</td><td>Someone outside the team</td><td>We chose it</td><td>A stakeholder wants it</td></tr><tr><td>Negotiable?</td><td>No, or very costly</td><td>Yes</td><td>Often</td></tr><tr><td>Goes in</td><td>§2</td><td>§4 or §9</td><td>§1 or §10</td></tr></table>"},
{t:"The three-question test",h:"<h2>The three-question test</h2><ol><li>Can we negotiate it?</li><li>Was it imposed from outside?</li><li>Does it limit our solution choices?</li></ol><p class='k'>No, yes, yes: it is a constraint.</p><p class='m'>“We use PostgreSQL” fails the test unless the client mandates it. Then it moves from §4 to §2.</p>",n:"Walk one borderline example with the room. A decision can become a constraint when someone outside the team mandates it."},
{t:"Kinds of constraints",h:"<h2>Kinds of constraints</h2><ul><li><span class='k'>Technical:</span> must run on existing systems or platforms</li><li><span class='k'>Organisational:</span> team size, budget, deadlines, processes</li><li><span class='k'>Legal and regulatory:</span> data protection, financial rules</li><li><span class='k'>Conventions:</span> coding standards, mandated documentation</li></ul>"},
{t:"Example: Doubles-to-Go constraints",h:"<h2>Doubles-to-Go constraints</h2><table><tr><th>ID</th><th>Constraint</th><th>Effect</th></tr><tr><td>C1</td><td>Card payments via a certified provider</td><td>No card handling in our code</td></tr><tr><td>C2</td><td>Launch within 4 months</td><td>Favours a simple architecture</td></tr><tr><td>C3</td><td>Team of 4 developers</td><td>Limits separate services</td></tr><tr><td>C4</td><td>Local data-protection rules</td><td>Affects storage and logging</td></tr><tr><td>C5</td><td>Hosting budget cap</td><td>Rules out costly options</td></tr></table><p class='m'>Number them (C1…Cn) so later sections can cite them.</p>"},
{e:4,t:"Card sort",h:"<h2>Card sort (4 min)</h2><p class='m'>Constraint, decision or requirement?</p><ol><li>We must launch within 4 months</li><li>We will use a queue for payments</li><li>Customers must be able to pay online</li><li>Customer data follows local data-protection rules</li><li>We will build a mobile web app</li><li>Support can diagnose a failed order in minutes</li><li>The hosting budget is capped</li></ol>",n:"Answers: 1 constraint. 2 decision. 3 requirement. 4 constraint. 5 decision. 6 requirement. 7 constraint."},
{e:8,t:"Exercise 2",h:"<h2>Exercise 2: constraints (8 min)</h2><p>Write 4–6 numbered constraints for your system, covering at least three kinds.</p><p class='m'>Columns: ID · Constraint · Why · Effect</p><p class='k'>Done when each passes the three-question test.</p><div class='xp'><b>Experienced?</b> Find one constraint your team treats as fixed that is really negotiable.</div>"},
{t:"Check: negotiable?",h:"<h2>Check (3 min)</h2><p>Swap with a neighbour.</p><ul><li>Which constraint could you renegotiate?</li><li>What would it buy you?</li><li>Is any decision hiding among the constraints?</li></ul>"},
{p:"Part 4 · §3 Context",t:"Part 4: Context",h:"<p class='m'>Part 4 · 11:25 to 11:55</p><h1>§3 Context and scope</h1><p>Who do we talk to?</p>"},
{t:"The system boundary",h:"<h2>The system boundary</h2><p>Treat your system as a <span class='k'>black box</span> and show everything that exchanges information with it.</p><p class='m'>Internal components are out of scope here. They belong in §5.</p>"},
{t:"Business and technical context",h:"<h2>Two views of the boundary</h2><div class='g' style='grid-template-columns:1fr 1fr'><div><b>Business context</b>Who or what exchanges domain information: orders, payments, reports</div><div><b>Technical context</b>The channels and protocols: HTTPS, files, messages, webhooks</div></div><p class='m'>Separate them when mixing makes either diagram hard to read.</p>"},
{t:"Build your context view",h:"<h2>Build your context view</h2><ol><li>System name in the centre</li><li>List every person and role</li><li>List every external system</li><li>One arrow per exchange, labelled with what flows</li><li>Mark who initiates</li><li>Dashed arrows for optional or async links</li><li>Fill the interface table</li></ol>"},
{t:"Example: business context",h:"<h2>Doubles-to-Go business context</h2><table><tr><th>Neighbour</th><th>Sends us</th><th>We send</th></tr><tr><td>Customer</td><td>Orders</td><td>“Order ready” SMS</td></tr><tr><td>Vendor</td><td>Menu and stock updates</td><td>Order list, payout report</td></tr><tr><td>Payment provider</td><td>Payment result</td><td>Payment request</td></tr><tr><td>SMS gateway</td><td>None</td><td>SMS requests</td></tr><tr><td>Support staff</td><td>Order look-ups</td><td>Order status</td></tr></table>"},
{t:"Business context diagram",h:"@@ctx@@",n:"Walk the arrows: each one is a labelled exchange. People are pills, external systems are dashed, our system is the filled box."},
{t:"Example: technical context",h:"<h2>Doubles-to-Go technical context</h2><table><tr><th>Neighbour</th><th>Direction</th><th>Data</th><th>Channel</th></tr><tr><td>Customer browser</td><td>↔</td><td>Orders, status</td><td>HTTPS, mobile web</td></tr><tr><td>Payment provider</td><td>↔</td><td>Requests, confirmations</td><td>HTTPS API + webhook</td></tr><tr><td>SMS gateway</td><td>→</td><td>“Order ready”</td><td>HTTPS API</td></tr><tr><td>Vendor phone</td><td>↔</td><td>Orders, stock</td><td>HTTPS, mobile web</td></tr></table>"},
{t:"Interface table anatomy",h:"<h2>What each interface row records</h2><ul><li>Neighbour and direction</li><li>Data exchanged</li><li>Channel and protocol</li><li>Who initiates</li><li>Synchronous or asynchronous</li><li>What happens when it fails</li></ul><p class='m'>The last row is the one most teams skip, and the one that causes incidents.</p>"},
{t:"Context mistakes",h:"<h2>Common mistakes</h2><p>✗ Internal components in the context diagram</p><p>✗ Unlabelled arrows</p><p>✗ Forgetting people (support, admins) and time-based neighbours (schedulers)</p><p>✗ Mixing business and technical detail in one diagram</p>"},
{t:"Boundary tests",h:"<h2>Boundary tests</h2><ol><li>Do we deploy or control it? Inside. Otherwise outside.</li><li>Who would be surprised if we changed an interface? They are a neighbour.</li></ol><p class='m'>Forgotten neighbours: monitoring, email, backups, admins, legacy files, schedulers.</p>"},
{e:20,t:"Exercise 3",h:"<h2>Exercise 3: context (20 min)</h2><ol><li>List neighbours silently, then share (5 min)</li><li>Draw the business context (8 min)</li><li>Fill the technical table (7 min)</li></ol><p class='k'>Done when every arrow is labelled and no internal parts appear.</p><div class='xp'><b>Experienced?</b> Add a failure-behaviour column for your three riskiest interfaces.</div>"},
{e:3,t:"Check: context",h:"<h2>Peer check (3 min)</h2><ul><li>Every arrow labelled</li><li>No internal parts</li><li>People and time-based neighbours included</li><li>Direction shown for each exchange</li></ul>"},
{p:"Part 5 · §4 Strategy",t:"Part 5: Strategy",h:"<p class='m'>Part 5 · 11:55 to 12:15</p><h1>§4 Solution strategy</h1><p>What is our approach?</p>"},
{t:"The bridge section",h:"<h2>The bridge section</h2><p class='k'>Quality goals (§1.2) + constraints (§2) → strategy (§4) → building blocks (§5)</p><p>§4 captures the fundamental decisions on how to achieve your top quality goals.</p>"},
{t:"Strategy: in and out",h:"<h2>What goes in, what stays out</h2><table><tr><th>In</th><th>Out</th></tr><tr><td>Top-level technology choices</td><td>Block-by-block detail (§5)</td></tr><tr><td>Top-level structure approach</td><td>Full rationale per decision (§9)</td></tr><tr><td>An approach for each top quality goal</td><td>Day-to-day coding rules</td></tr><tr><td>Build versus buy</td><td></td></tr></table><p class='m'>Half a page to a page. Longer means the architecture isn’t clear yet.</p>"},
{t:"Derive your strategy",h:"<h2>Derive your strategy</h2><p>For each quality goal:</p><ol><li>Restate the goal</li><li>Brainstorm two approaches</li><li>Choose one and say why, citing a constraint if relevant</li><li>State the trade-off you accept</li><li>Check no constraint forbids it</li></ol>"},
{t:"Example: Doubles-to-Go strategy",h:"<h2>Doubles-to-Go strategy</h2><table><tr><th>Goal</th><th>Approach</th><th>Trade-off</th></tr><tr><td>#reliable</td><td>Idempotent order requests, queued payment confirmations</td><td>Slight delay, more parts</td></tr><tr><td>#usable</td><td>Lightweight mobile web app, minimal scripts</td><td>Fewer fancy interactions</td></tr><tr><td>#secure</td><td>Provider-hosted payment page, no card data in our system (C1)</td><td>Dependency on the provider</td></tr></table>"},
{t:"Generic vs specific strategy",h:"<h2>Specific beats generic</h2><table><tr><th>Generic</th><th>Specific</th></tr><tr><td>“Clean code”</td><td>Hexagonal structure so payment providers are swappable</td></tr><tr><td>“Best practices”</td><td>Idempotency key on every write request</td></tr><tr><td>“Scalable cloud”</td><td>Two app instances behind one load balancer, managed database</td></tr></table><p class='k'>If a neighbour can’t guess something specific from your table, it is too generic.</p>"},
{e:15,t:"Exercise 4",h:"<h2>Exercise 4: strategy (15 min)</h2><ol><li>Copy your three quality goals from Exercise 1</li><li>Fill the strategy table</li><li>Peer test: a neighbour reads only your table and guesses two things about your architecture</li></ol><div class='xp'><b>Experienced?</b> For each row, name the strongest alternative you rejected.</div>"},
{p:"Lunch",t:"Lunch",h:"<h1>Lunch</h1><p class='m'>Back at 13:00 for Part 6: building blocks.</p>"},
{p:"Part 6 · §5 Building blocks",t:"Part 6: Building block view",h:"<p class='m'>Part 6 · 13:00 to 13:50</p><h1>§5 Building block view</h1><p>What are the parts, and what do they promise?</p>"},
{t:"Building blocks",h:"<h2>Building blocks</h2><p>A <span class='k'>building block</span> is a unit of structure: the system, a container or a component.</p><ul><li>Blocks form a hierarchy: whole system → main blocks (Level 1) → blocks inside them (Level 2)</li><li>Zoom only where it helps</li></ul>"},
{t:"Black box vs white box",h:"<h2>Black box vs white box</h2><p><span class='k'>Black box:</span> what it does and the interfaces it offers. The inside is hidden.</p><p><span class='k'>White box:</span> what it contains and how those parts interact.</p><p class='m'>Analogy: a radio. Black box = knobs and sound. White box = circuit board.</p><p class='k'>Document most blocks as black boxes. Open the important ones as white boxes.</p>"},
{t:"The hierarchy",h:"@@hier@@"},
{t:"How to split into blocks",h:"<h2>How to split into blocks</h2><p>Split by one or more of:</p><ul><li><span class='k'>Responsibility:</span> one block, one clear job</li><li><span class='k'>Reason to change:</span> things that change together stay together</li><li><span class='k'>Data ownership:</span> who owns which data</li><li><span class='k'>Runtime boundary:</span> separately started or deployed things</li><li><span class='k'>Team or skill boundary</span></li></ul>"},
{o:1,t:"Walkthrough: responsibilities to blocks",h:"@@resp@@",n:"Do this live on the whiteboard with the room’s suggestions before showing the next slide."},
{o:1,t:"How many blocks?",h:"<h2>How many blocks?</h2><p>Aim for roughly <span class='k'>5 to 9</span> at Level 1 so people can hold them in their heads.</p><ul><li>Fewer than 4: you may be hiding structure</li><li>More than 12: you are probably mixing levels</li><li>Unsure? Group, then zoom into the group later</li></ul>"},
{t:"Naming blocks",h:"<h2>Naming blocks</h2><table><tr><th>✗ Avoid</th><th>✓ Prefer</th></tr><tr><td>“Redis”</td><td>Session Store</td></tr><tr><td>“Microservice 3”</td><td>Notification Adapter</td></tr><tr><td>“Utils”</td><td>name the actual responsibility</td></tr></table><p class='k'>Nouns, not technologies. The name should survive a technology change.</p>"},
{t:"Diagram checklist",h:"<h2>A diagram checklist</h2><ul><li><span class='k'>Title</span> that says the diagram type and scope</li><li><span class='k'>Legend</span> explaining shapes, line styles and colours</li><li><span class='k'>Every line labelled</span>, specifically: avoid “uses”</li><li>Name the <span class='k'>protocol or technology</span> on container-to-container lines</li><li><span class='k'>Consistent</span> shapes and colours across diagrams</li></ul><p class='src'>Source: c4model.com notation guidance (Simon Brown).</p>",n:"Use this checklist in the peer reviews of Exercises 3 and 5a. Every diagram in this deck follows it."},
{t:"Build Level 1: steps",h:"<h2>Build Level 1: steps</h2><ol><li>List responsibilities (from §1.1)</li><li>Group related responsibilities</li><li>Name each group (noun, not technology)</li><li>One sentence of responsibility per block</li><li>Draw labelled “uses” arrows</li><li>Add §3 neighbours outside the boundary</li><li>Check each block against §4 strategy and a quality goal</li><li>Check count (5 to 9) and names</li></ol>"},
{t:"Doubles-to-Go Level 1",h:"@@l1@@",n:"Read left to right: clients call the Order Service, which owns the rules and delegates to the adapters and the database. The dashed arrow is the asynchronous webhook result coming back from the provider."},
{t:"Block table",h:"<h2>Block table</h2><table><tr><th>Block</th><th>Responsibility</th><th>Key interfaces</th></tr><tr><td>Customer Web App</td><td>Customers browse, order, track</td><td>Order Service API</td></tr><tr><td>Vendor Console</td><td>Vendors manage menu, stock, orders</td><td>Order Service API</td></tr><tr><td>Order Service</td><td>Owns the order lifecycle and rules</td><td>API; Payment and Notification adapters</td></tr><tr><td>Payment Adapter</td><td>Hides the provider’s API; handles callbacks</td><td>Provider API and webhook</td></tr><tr><td>Notification Adapter</td><td>Sends SMS</td><td>SMS gateway API</td></tr><tr><td>Database</td><td>Stores orders, menus, stock</td><td>Order Service only</td></tr></table>"},
{t:"Interfaces",h:"<h2>Interfaces</h2><p>An <span class='k'>interface</span> is how other blocks use a block: operations, data, rules.</p><p>For each key interface record: <span class='k'>name · direction · data · where the contract lives.</span></p><p class='m'>Most integration bugs hide at interfaces, and coding agents implement against them.</p>"},
{t:"Example: Order Service API",h:"<h2>Example: Order Service API</h2><table><tr><th>Operation</th><th>Called by</th><th>Data in</th><th>Data out</th></tr><tr><td>PlaceOrder</td><td>Customer Web App</td><td>cart, idempotency key</td><td>order id</td></tr><tr><td>GetOrderStatus</td><td>Web App, Vendor Console</td><td>order id</td><td>status</td></tr><tr><td>UpdateStock</td><td>Vendor Console</td><td>item, quantity</td><td>ack</td></tr><tr><td>MarkPaid</td><td>Payment Adapter</td><td>order id, payment ref</td><td>ack</td></tr></table><p class='m'>Contracts for PlaceOrder (slide 85) and MarkPaid follow.</p>"},
{t:"When to zoom to Level 2",h:"<h2>When to zoom to Level 2</h2><p>Open a block as a white box when it is:</p><ul><li><span class='k'>Risky:</span> money, safety, legal</li><li><span class='k'>Complex:</span> many internal rules</li><li><span class='k'>A hotspot:</span> changes often</li><li><span class='k'>Depended on by many</span></li></ul><p class='m'>Otherwise stay at Level 1. Lower-level diagrams change more often and cost more to maintain.</p>"},
{t:"Example: Order Service white box",h:"@@l2@@",n:"Only the Idempotency Guard and the Order Lifecycle need contracts. Each inner block gets one line of responsibility."},
{t:"Contracts",h:"<h2>Contracts</h2><p>A <span class='k'>contract</span> states what a block promises and expects.</p><table><tr><th>Part</th><th>Meaning</th></tr><tr><td>Pre-conditions</td><td>What must be true before it’s called</td></tr><tr><td>Post-conditions</td><td>What is true after it succeeds</td></tr><tr><td>Invariants</td><td>What is always true</td></tr><tr><td>Error modes</td><td>How it fails, and what callers see</td></tr></table>"},
{o:1,t:"Why contracts matter now",h:"<h2>Why contracts matter now</h2><ul><li>Testable by developers and testers</li><li>A reviewer can check a change against them</li><li>They are exactly the knowledge an agent cannot infer from code alone</li></ul><p>In multi-agent research, incomplete or missing verification is a recurring failure category (Cemri et al., 2025). Explicit contracts give any checker, human or AI, something concrete to verify against.</p><p class='src'>The final point is our reading of the research, not a claim the paper makes about contracts.</p>",n:"The final point is our reading of the research, not a claim the paper makes about contracts."},
{t:"Write a contract: steps",h:"<h2>Write a contract: steps</h2><ol><li>Pick the riskiest block</li><li>Pick its most important operation</li><li>List pre-conditions (inputs valid? caller allowed?)</li><li>List post-conditions (what is stored or returned?)</li><li>List invariants (what must never break?)</li><li>List error modes, each with a caller-visible result</li><li>Re-read: could a stranger write a test from this?</li></ol>"},
{t:"Contract: PlaceOrder",h:"<h2>Contract: Order Service PlaceOrder</h2><table><tr><th>Part</th><th>Content</th></tr><tr><td>Pre-conditions</td><td>Cart not empty; vendor open; items in stock; request carries a unique idempotency key</td></tr><tr><td>Post-conditions</td><td>Exactly one order stored as PendingPayment; order id returned</td></tr><tr><td>Invariants</td><td>An idempotency key creates at most one order; order ids are never reused</td></tr><tr><td>Error modes</td><td>VendorClosed, ItemUnavailable, DuplicateRequest (returns the original order)</td></tr></table>"},
{t:"Contract: HandleWebhook",h:"<h2>Contract: Payment Adapter HandleWebhook</h2><table><tr><th>Part</th><th>Content</th></tr><tr><td>Pre-conditions</td><td>Signature verified; payment reference known</td></tr><tr><td>Post-conditions</td><td>Order marked Paid or Failed exactly once; event acknowledged</td></tr><tr><td>Invariants</td><td>Replaying the same event never changes state twice; unknown outcomes never become Failed</td></tr><tr><td>Error modes</td><td>InvalidSignature (rejected, logged), UnknownReference (parked for review), OrderServiceUnavailable (retry later)</td></tr></table>"},
{t:"Invariants become tests",h:"<h2>Invariants become tests</h2><p>Each invariant is a test waiting to be written.</p><div class='xp'>Given a PlaceOrder request with key K · when it is sent twice · then exactly one order exists.</div><p class='k'>If you can’t phrase an invariant as a test, it is probably a hope.</p>"},
{t:"§5 common mistakes",h:"<h2>Common mistakes in §5</h2><p>✗ 20+ blocks at Level 1</p><p>✗ Blocks named after technology</p><p>✗ Missing responsibilities</p><p>✗ Contracts for everything (document the critical ones)</p><p>✗ Diagram and table disagree on names</p>"},
{e:20,t:"Exercise 5a",h:"<h2>Exercise 5a: Level 1 (20 min)</h2><p>Follow the steps on slide 75. Output: diagram and block table.</p><p class='k'>Done when: 5 to 9 blocks, each with a one-sentence responsibility.</p><div class='xp'><b>Experienced?</b> Add a “reason to change” column and justify one split by it.</div>"},
{e:15,t:"Exercise 5b",h:"<h2>Exercise 5b: one contract (15 min)</h2><p>Follow the contract steps on slide 84 for your riskiest block.</p><p class='k'>Check: at least one error mode, every invariant testable, peer swap (5 min).</p><div class='xp'><b>Experienced?</b> Write the invariant as a test case in your own stack.</div>"},
{e:3,t:"Peer check: §5",h:"<h2>Peer check §5 (3 min)</h2><ul><li>5 to 9 blocks, no brand names</li><li>Every block has one responsibility sentence</li><li>Diagram and table use identical names</li><li>The contract has a caller-visible result for every error</li></ul>"},
{p:"Part 7 · §6 Runtime",t:"Part 7: Runtime view",h:"<p class='m'>Part 7 · 13:50 to 14:10</p><h1>§6 Runtime view</h1><p>How do the parts interact?</p>"},
{t:"Structure vs behaviour",h:"<h2>Structure vs behaviour</h2><p><span class='k'>Structure</span> shows what exists. <span class='k'>Runtime</span> shows how it behaves.</p><p>The runtime view documents scenarios of how building blocks interact over time.</p>"},
{t:"Which scenarios to document",h:"<h2>Which scenarios to document</h2><p>Pick scenarios that are:</p><ul><li>the most important</li><li>the riskiest</li><li>surprising</li><li>involving many blocks</li><li>showing a failure</li></ul><p class='m'>Real systems: 3 to 5. Today: 1 or 2.</p>"},
{t:"Reading a sequence diagram",h:"@@seqmini@@<p style='font-size:22px;margin-top:6px'>Participants across the top. Lifelines go down and time flows down. Solid arrow: request. Dashed arrow: reply. alt … else … end marks alternative paths.</p>"},
{e:0,t:"Write a runtime scenario: steps",h:"<h2>Write a runtime scenario: steps</h2><ol><li>Name it with a verb (“Place and pay for an order”)</li><li>List participants (only §5 blocks and neighbours)</li><li>Write the steps in plain words first</li><li>Convert to messages</li><li>Add one failure branch (alt)</li><li>Add a three-line caption: what to notice</li></ol>"},
{t:"Runtime: happy path",h:"@@seqhappy@@"},
{t:"Runtime: failure path",h:"@@seqfail@@<p style='font-size:22px;margin-top:6px'>Unknown is not failed: the order stays pending until checked. Supports #reliable.</p>"},
{o:1,t:"Why the caption matters",h:"<h2>Why the caption matters</h2><p>A diagram shows what happened. The caption says what to notice.</p><ul><li>Which quality goal does this scenario protect?</li><li>Which contract does it exercise? (HandleWebhook, slide 86)</li><li>What would break if this step were removed?</li></ul>"},
{o:1,t:"Scenario ideas",h:"<h2>Scenario ideas to choose from</h2><ul><li>Duplicate webhook</li><li>Vendor closes mid-order</li><li>SMS gateway down</li><li>Lunchtime peak</li><li>Customer retries after a timeout</li><li>Vendor updates stock during checkout</li></ul>"},
{t:"§6 common mistakes",h:"<h2>Common mistakes in §6</h2><p>✗ Participants that don’t exist in §5</p><p>✗ No failure branch</p><p>✗ More than about 8 steps (split it)</p><p>✗ Several scenarios squeezed into one diagram</p>"},
{e:15,t:"Exercise 6",h:"<h2>Exercise 6: runtime (15 min)</h2><p>Follow the steps on slide 96 for your most important flow.</p><p class='k'>Done when: participants match your Level 1 names, one alt, 8 steps or fewer.</p><div class='xp'><b>Experienced?</b> Pick the failure scenario most likely to wake someone at night, and document that instead.</div>"},
{e:3,t:"Peer check: §6",h:"<h2>Peer check §6 (3 min)</h2><ul><li>Names match §5 exactly</li><li>A failure branch with a visible outcome</li><li>A caption that says what to notice</li></ul>"},
{p:"Part 8 · §7 Deployment",t:"Part 8: Deployment view",h:"<p class='m'>Part 8 · 14:10 to 14:20</p><h1>§7 Deployment view</h1><p>Where does it run?</p>"},
{t:"What the deployment view shows",h:"<h2>What the deployment view shows</h2><p>Where blocks run: environments, machines or cloud services, networks.</p><p>Include: environments (production, staging…), nodes, a mapping table (block → node), and the pipeline (build → test → deploy).</p>"},
{t:"Write your deployment view: steps",h:"<h2>Write your deployment view: steps</h2><ol><li>List environments (production, test, dev)</li><li>For production, list nodes or services</li><li>Map each §5 block to a node</li><li>Note anything outside your control (SaaS)</li><li>Sketch the pipeline in 4 or 5 boxes</li></ol>"},
{t:"Doubles-to-Go deployment",h:"@@deploy@@",n:"Static clients sit on a CDN. One app server pair and a managed database run in a regional cloud. The payment provider and SMS gateway are external SaaS. The pipeline runs push, build, test, staging, then production."},
{o:1,t:"Who reads this view",h:"<h2>Who reads this view</h2><ul><li><span class='k'>Operators:</span> what runs where, and what do I restart?</li><li><span class='k'>Cost owners:</span> what does this cost, and what scales it?</li><li><span class='k'>Security:</span> what is exposed, and who can reach it?</li><li><span class='k'>Developers:</span> how does my change reach production?</li></ul>"},
{e:8,t:"Exercise 7",h:"<h2>Exercise 7: deployment sketch (8 min)</h2><p>Follow the steps on slide 106.</p><p class='k'>Done when: every block appears in the mapping table.</p><div class='xp'><b>Experienced?</b> Add one line per node: how it fails and how you would notice.</div>"},
{p:"Part 9 · §8 Crosscutting concepts",t:"Part 9: Crosscutting concepts",h:"<p class='m'>Part 9 · 14:20 to 14:35</p><h1>§8 Crosscutting concepts</h1><p>What recurs everywhere?</p>"},
{t:"What is a crosscutting concept?",h:"<h2>What is a crosscutting concept?</h2><p>Recurring solution approaches and patterns.</p><p class='k'>Test: does it affect two or more blocks? Then it belongs here. If only one block, put it in §5.</p>"},
{t:"Typical topics",h:"<h2>Typical topics</h2><p>Security · logging and observability · error handling · persistence · UI, language and accessibility · configuration · testing · idempotency · retries</p>"},
{t:"Write a concept: steps",h:"<h2>Write a concept: steps</h2><p>For each concept:</p><p class='k'>Name → rule → where it applies → why → link (to an ADR or scenario).</p><p class='m'>One paragraph. Name the pattern, not a tutorial.</p>"},
{t:"Doubles-to-Go concepts",h:"<h2>Doubles-to-Go concepts</h2><table><tr><th>Concept</th><th>Rule</th><th>Applies to</th></tr><tr><td>Idempotency</td><td>Every write carries a unique key; repeats return the original result</td><td>Order Service, Payment Adapter</td></tr><tr><td>Correlation id</td><td>Every request gets an id that appears in all logs</td><td>All blocks</td></tr><tr><td>Retry with backoff</td><td>Failed external calls are retried with increasing delays</td><td>Adapters</td></tr></table>"},
{o:1,t:"One concept written in full",h:"<h2>One concept written in full</h2><p><span class='k'>Idempotency.</span> Every write request carries a unique key chosen by the caller. The receiving block stores the key with the result and, on a repeat, returns the stored result without acting again. Applies to Order Service (PlaceOrder) and Payment Adapter (webhook handling). Why: mobile networks drop and clients retry, so duplicates are normal. Supports #reliable. See ADR-0003 and the failure scenario in §6.</p>"},
{t:"§8 common mistakes",h:"<h2>Common mistakes in §8</h2><p>✗ A concept that applies to one block (move it to §5)</p><p>✗ Tutorials instead of rules</p><p>✗ No link to the reason (a decision or goal)</p>"},
{e:10,t:"Exercise 8",h:"<h2>Exercise 8: concepts (10 min)</h2><p>List 3 recurring ideas across your blocks. Write each with the steps on slide 113.</p><div class='xp'><b>Experienced?</b> Pick the concept most often violated in your real code and write the rule so it could be linted.</div>"},
{p:"Break",t:"Break",h:"<h1>Break</h1><p class='m'>Back at 14:50 for Part 10: decisions.</p>"},
{p:"Part 10 · §9 Decisions",t:"Part 10: Architecture decisions",h:"<p class='m'>Part 10 · 14:50 to 15:20</p><h1>§9 Architecture decisions</h1><p>Why this choice?</p>"},
{t:"Why decisions vanish",h:"<h2>Why decisions vanish</h2><p>Teams forget why things are built as they are, then re-debate or reverse them.</p><p>Write one ADR per important decision. Smaller pieces are easier to read, create and maintain.</p><p class='m'>A decision means choosing one alternative based on criteria.</p>"},
{t:"What deserves an ADR",h:"<h2>What deserves an ADR</h2><p>Architecturally significant decisions: those affecting structure, non-functional characteristics, dependencies, interfaces or construction techniques.</p><p>Also: risky, expensive, unconventional, long-lasting, wide-impact or hard-to-decide choices. Skip tiny development choices.</p>"},
{t:"ADR anatomy",h:"<h2>ADR anatomy</h2><table><tr><th>Field</th><th>Question</th></tr><tr><td>Title</td><td>What was decided?</td></tr><tr><td>Status</td><td>proposed · accepted · rejected · deprecated · superseded</td></tr><tr><td>Context</td><td>Why did we have to decide?</td></tr><tr><td>Options</td><td>What else did we consider?</td></tr><tr><td>Decision</td><td>What did we choose, and why?</td></tr><tr><td>Consequences</td><td>What gets better? What gets worse?</td></tr></table>"},
{t:"MADR and the lifecycle",h:"<h2>MADR and the lifecycle</h2><p>MADR is a lean Markdown ADR format, kept as one numbered file per decision.</p><p class='k'>Never edit history. If a decision is reversed, mark the old ADR superseded and write a new one that links back.</p>"},
{t:"Write an ADR: steps",h:"<h2>Write an ADR: steps</h2><ol><li>Pick one significant decision</li><li>Context in 2 or 3 sentences</li><li>At least two options</li><li>State the decision and the main reason</li><li>Consequences: at least one good, at least one bad</li><li>Link to the quality goal or constraint it serves</li><li>Set the status and add a date</li></ol>"},
{t:"ADR 0003",h:"<h2>ADR 0003</h2><p class='k'>Process payment confirmations through a queue</p><p class='m'>Status: accepted · Date: 2026-10-27</p><p><b>Context.</b> The payment provider sometimes confirms late or twice. Handling confirmations inside the web request risks lost or duplicated updates. (Goal #reliable)</p><p><b>Options.</b> 1. Handle confirmations synchronously in the webhook request. 2. Put confirmations on a queue and process them one by one.</p><p><b>Decision.</b> Option 2: ordering and retries are easier, and failures don’t lose events.</p><p><b>Consequences.</b> + Survives provider and network outages. + Duplicates handled in one place. − Confirmation may lag by seconds. − One more component to operate.</p>"},
{t:"ADR 0004",h:"<h2>ADR 0004</h2><p class='k'>Build one deployable service, not several</p><p class='m'>Status: accepted · Date: 2026-10-27</p><p><b>Context.</b> Four developers and a four-month deadline (C2, C3). Separate services would add deployment and monitoring work we cannot afford.</p><p><b>Options.</b> 1. One modular application with clear internal blocks. 2. Separate services for orders, payments and notifications.</p><p><b>Decision.</b> Option 1. Keep blocks separate in code so a split stays possible later.</p><p><b>Consequences.</b> + Simple to deploy and debug. + Fits the team size. − Parts cannot scale independently. − Discipline needed to keep boundaries clean.</p>"},
{o:1,t:"Superseding a decision",h:"<h2>Superseding a decision</h2><p class='k'>0009: Move payment confirmations to a managed queue service</p><p class='m'>Status: accepted · Supersedes: 0003</p><p>ADR 0003 stays in the repository with its status changed to superseded by 0009. The history of why stays readable.</p>"},
{t:"§9 common mistakes",h:"<h2>Common mistakes in §9</h2><p>✗ Written afterwards as justification</p><p>✗ No alternatives listed</p><p>✗ Only good consequences</p><p>✗ Several decisions in one record</p><p>✗ Editing old ADRs instead of superseding them</p>"},
{t:"ADRs and AI",h:"<h2>ADRs and AI</h2><p>Writing ADRs takes effort, so teams skip them. AI can draft them.</p><p>A 2026 study of ADRs from 750 repositories found a recency window of 3 to 5 prior records gave the best balance of quality and efficiency when prompting LLMs.</p><p class='k'>AI drafts the structure. You supply the real alternatives and the honest downside.</p><p class='src'>arXiv:2604.03826, April 2026.</p>"},
{e:20,t:"Exercise 9",h:"<h2>Exercise 9: one ADR (20 min)</h2><p>Use the steps and example on slides 124 and 125. Constraint: two options and one negative consequence.</p><p>Peer check (5 min): would a new teammate understand why not the other option?</p><div class='xp'><b>Experienced?</b> Write the ADR for a decision your team made without one, and see whether you still agree.</div>"},
{e:3,t:"Peer check: §9",h:"<h2>Peer check §9 (3 min)</h2><ul><li>Two real options, not a straw man</li><li>A bad consequence that actually stings</li><li>Linked to a goal or constraint</li><li>One decision only</li></ul>"},
{p:"Part 11 · §10 Quality requirements",t:"Part 11: Quality requirements",h:"<p class='m'>Part 11 · 15:20 to 15:30</p><h1>§10 Quality requirements</h1><p>How good, measurably?</p>"},
{t:"§10 extends §1.2",h:"<h2>§10 extends §1.2</h2><p>§1.2 holds your top three to five goals. §10 holds the rest, as a quality tree with scenarios as leaves.</p><p class='m'>Real systems often have many scenarios, so arc42 splits them between §1.2 and §10.</p>"},
{t:"Three kinds of scenario",h:"<h2>Three kinds of scenario</h2><table><tr><th>Kind</th><th>Example</th></tr><tr><td>Usage</td><td>95% of confirmations appear within 3 s at 300 orders per minute</td></tr><tr><td>Change</td><td>A new payment provider can be added by one developer in 5 days</td></tr><tr><td>Failure</td><td>Connection drops mid-payment: exactly one order and one charge exist</td></tr></table>"},
{t:"Doubles-to-Go quality tree",h:"@@qtree@@"},
{o:1,t:"Which scenarios matter most?",h:"<h2>Which scenarios matter most?</h2><p>Rank scenarios on two questions:</p><ul><li><span class='k'>Importance:</span> how much do stakeholders care?</li><li><span class='k'>Difficulty:</span> how hard is it for the architecture to achieve?</li></ul><p>High on both: design for it now. High importance, low difficulty: just do it. Low importance, high difficulty: question the requirement.</p>"},
{e:8,t:"Exercise 10",h:"<h2>Exercise 10: two more scenarios (8 min)</h2><p>Add one change and one failure scenario to your skeleton. Each needs a number and a link to a quality goal.</p><div class='xp'><b>Experienced?</b> Add the scenario your current system is most likely to fail.</div>"},
{e:2,t:"Check: §10",h:"<h2>Check §10 (2 min)</h2><ul><li>Every scenario has a number</li><li>Every leaf links to a goal</li><li>All three kinds are represented</li></ul>"},
{p:"Part 12 · §11 Risks and §12 Glossary",t:"Part 12: Risks and glossary",h:"<p class='m'>Part 12 · 15:30 to 15:40</p><h1>§11 Risks and §12 Glossary</h1><p>What could go wrong? What do the words mean?</p>"},
{t:"Risk vs technical debt",h:"<h2>Risk vs technical debt</h2><p><span class='k'>Risk:</span> something that might go wrong, with a plan.</p><p><span class='k'>Technical debt:</span> a shortcut you already took and must repay.</p><p>Both belong in §11. Both need an owner.</p>"},
{t:"Anatomy of a risk entry",h:"<h2>Anatomy of a risk entry</h2><table><tr><th>Field</th><th>Question</th></tr><tr><td>Risk</td><td>What might go wrong?</td></tr><tr><td>Likelihood and impact</td><td>How likely, how bad?</td></tr><tr><td>Mitigation</td><td>What do we do about it?</td></tr><tr><td>Owner</td><td>Who watches it?</td></tr></table><p class='k'>A risk with no owner is a worry.</p>"},
{t:"Doubles-to-Go risks",h:"<h2>Doubles-to-Go risks</h2><table><tr><th>Risk</th><th>L/I</th><th>Mitigation</th><th>Owner</th></tr><tr><td>Payment provider outage at lunchtime</td><td>Med/High</td><td>Queue and retry (ADR-0003); manual reconciliation</td><td>Tech lead</td></tr><tr><td>Only 4 developers</td><td>High/Med</td><td>Keep §5 simple; document key contracts</td><td>Owner</td></tr></table>"},
{t:"Glossary",h:"<h2>Glossary</h2><p>Define terms your reader won’t know. One definition per term, used consistently everywhere.</p><ul><li><span class='k'>Vendor:</span> a registered seller</li><li><span class='k'>Idempotency key:</span> a unique token that makes a repeated request safe</li><li><span class='k'>Pickup window:</span> the time range a customer may collect an order</li></ul><p class='m'>Consistent naming also prevents drift for coding agents.</p>"},
{e:8,t:"Exercise 11",h:"<h2>Exercise 11: risks and glossary (8 min)</h2><p>Add 2 risks (with mitigation and owner) and 5 glossary terms to your skeleton.</p><div class='xp'><b>Experienced?</b> Add the technical debt your team accepted last quarter, with the payback condition.</div>"},
{p:"Part 13 · AI lab",t:"Part 13: AI lab",h:"<p class='m'>Part 13 · 15:40 to 16:20</p><h1>AI lab</h1><p>Draft, red-team, repair.</p>"},
{t:"What the research says AI does well",h:"<h2>What the research says AI does well</h2><ul><li><span class='k'>Views from code:</span> across 340 repositories and 4,137 generated views, LLMs produced syntactically valid views but at code-level rather than architectural granularity. Few-shot prompting reduced clarity failures by 9.2% versus zero-shot. The authors call LLMs assistive tools, not autonomous architects.</li><li><span class='k'>Decision records:</span> 3 to 5 prior records as context worked best.</li></ul><p class='k'>Takeaway: AI drafts what is visible. You add what is implicit.</p><p class='src'>Sathvika et al., ICSA 2026, arXiv:2603.21178 · arXiv:2604.03826</p>"},
{t:"Who does what",h:"<h2>Who does what</h2><table><tr><th>AI is useful for</th><th>You must decide</th></tr><tr><td>First drafts of tables and prose</td><td>What is true for your system</td></tr><tr><td>Spotting gaps and inconsistencies</td><td>Which trade-off is right</td></tr><tr><td>Rewriting for clarity</td><td>Which risks matter</td></tr><tr><td>Suggesting questions to ask your team</td><td>Anything legal or security-critical</td></tr></table>"},
{t:"Prompt anatomy",h:"<h2>Prompt anatomy</h2><ul><li><span class='k'>Role:</span> “You are a software architect.”</li><li><span class='k'>Task:</span> exactly what to produce</li><li><span class='k'>Source of truth:</span> your draft, pasted in</li><li><span class='k'>Rules:</span> what not to do (don’t invent)</li><li><span class='k'>Format:</span> Markdown, length limit</li><li><span class='k'>Uncertainty:</span> ask for assumptions and questions</li></ul>"},
{t:"Prompt template",h:"<h2>Prompt template</h2><div class='xp' style='font-size:18px;line-height:1.4'>You are a software architect. Using my arc42 draft below as the source of truth, produce: [target sections: §7, §8, §11, §12 + rewrite of §4].<br><br>RULES<br>- Use only facts from my draft. Mark anything missing as TODO; do not invent numbers, vendors, or dates.<br>- Keep all IDs (C1.., ADR-..) and reference them where relevant.<br>- Output Markdown, max 2 pages per section.<br>- End with (a) assumptions made, (b) questions you’d ask the team.<br><br>MY DRAFT<br>[paste §1–§6 and any ADRs]</div>"},
{e:40,t:"Lab plan",h:"<h2>Lab plan (40 min)</h2><table><tr><th>Time</th><th>Step</th></tr><tr><td>0 to 10</td><td>Generate: run the template on your draft</td></tr><tr><td>10 to 22</td><td>Red-team: find at least 5 flaws and tag each</td></tr><tr><td>22 to 34</td><td>Repair: mark each AI line Accepted, Rejected or Edited, with a reason</td></tr><tr><td>34 to 40</td><td>Gallery: each team shares its best catch</td></tr></table>"},
{e:10,t:"Step 1: generate",h:"<h2>Step 1: generate (10 min)</h2><ul><li>Paste only your own draft. No confidential material.</li><li>Keep the AI’s full answer, including its assumptions and questions.</li><li>Don’t edit yet. Read it once, quickly, as a stranger would.</li></ul>"},
{t:"Red-team lenses",h:"<h2>Red-team lenses</h2><p>Research on multi-agent LLM failures found 14 failure modes in three categories: specification issues, inter-agent misalignment and task verification. Borrow the three lenses for documents:</p><table><tr><th>Lens</th><th>Ask</th></tr><tr><td>Specification</td><td>Did it ignore what I gave it?</td></tr><tr><td>Misalignment</td><td>Do sections contradict each other?</td></tr><tr><td>Verification</td><td>Is any claim unsupported?</td></tr></table><p class='src'>Cemri et al., NeurIPS 2025, arXiv:2503.13657.</p>"},
{t:"What each lens catches",h:"<h2>What each lens catches</h2><table><tr><th>Lens</th><th>Example</th></tr><tr><td>Specification</td><td>Picked a service that breaks constraint C5</td></tr><tr><td>Misalignment</td><td>§5 says “Order Service”, §6 says “Orders API”</td></tr><tr><td>Verification</td><td>“99.99% uptime” appears from nowhere</td></tr><tr><td>Specification</td><td>Dropped the idempotency rule you gave it</td></tr><tr><td>Misalignment</td><td>A risk mitigation cites an ADR that doesn’t exist</td></tr><tr><td>Verification</td><td>Invented a vendor or a latency figure</td></tr></table>"},
{t:"Flaw log and scoring",h:"<h2>Flaw log and scoring</h2><table><tr><th>#</th><th>Quote</th><th>Lens</th><th>Severity</th><th>Fix</th></tr><tr><td>1</td><td></td><td>Spec / Align / Verify</td><td>🔴 🟠 🟡</td><td></td></tr></table><p class='m'>🔴 breaks the architecture · 🟠 misleading · 🟡 cosmetic</p><p class='k'>Scoring: 🔴 3 · 🟠 2 · 🟡 1. +3 for a flaw no other team found.</p>"},
{t:"Step 3: repair with verdicts",h:"<h2>Step 3: repair with verdicts</h2><p>Every AI line gets a verdict:</p><ul><li>Accepted as written</li><li>Rejected (say why)</li><li>Edited (say what you changed)</li></ul><p class='k'>Keep the log. The reasons are the learning.</p>"},
{t:"Ask AI to teach you, too",h:"<h2>Ask AI to teach you, too</h2><p>After repairing, ask:</p><ul><li>“Why did you choose X?”</li><li>“What would break if constraint C3 changed?”</li><li>“What did you assume?”</li></ul><p class='m'>The 2026 Anthropic study found that people who asked conceptual and follow-up questions learned much more than those who delegated generation.</p>"},
{t:"Data safety",h:"<h2>Data safety</h2><ul><li>Never paste passwords, keys, personal data or client-confidential details.</li><li>Use your workshop case</li><li>Check your organisation’s AI policy before using any tool at work</li><li>Today’s lesson works with any capable assistant</li></ul>"},
{t:"Gallery and reflection",h:"<h2>Gallery and reflection (last 6 min)</h2><p>Each team shares:</p><ul><li>the worst catch</li><li>what surprised us</li><li>what we could not have verified without our own draft</li></ul>"},
{o:1,t:"Advanced prompts for experienced engineers",h:"<h2>Advanced prompts for experienced engineers</h2><ul><li>“List every claim in this section that is not supported by my draft.”</li><li>“Find a counterexample to each invariant in my contract.”</li><li>“Which two ADRs conflict, and under what conditions?”</li><li>“Which quality scenario would this design fail first, and why?”</li><li>“List every ID referenced that does not exist.”</li></ul>"},
{p:"Part 14 · Agents as readers",t:"Part 14: Agents as readers",h:"<p class='m'>Part 14 · 16:20 to 16:35</p><h1>Agents as readers</h1><p>Writing for two kinds of reader.</p>"},
{t:"Two readers",h:"<h2>Two readers</h2><table><tr><th></th><th>Human</th><th>Agent</th></tr><tr><td>Needs</td><td>Understanding, motivation</td><td>Unambiguous rules and contracts</td></tr><tr><td>Fails when</td><td>Too long or vague</td><td>Too much, stale or contradictory</td></tr><tr><td>Navigates by</td><td>Headings, diagrams</td><td>Files, IDs, search</td></tr></table>"},
{t:"What the evidence says",h:"<h2>What the evidence says</h2><ul><li><span class='k'>ETH Zurich (Feb 2026):</span> auto-generated context files tended to lower task success and raised cost by over 20%. Developer-written files helped a little but cost more. (arXiv:2602.11988, preprint, Python repositories)</li><li><span class='k'>Augment Code (vendor study, 2026):</span> files of roughly 100 to 150 lines with a few focused reference documents did best. Long cross-cutting files at the repo root did worse, and a long list of “don’ts” with no “do instead” hurt.</li></ul><p class='k'>Read both as signals. The headline is the same: short, specific and human-written.</p>"},
{t:"The nuance",h:"<h2>The nuance</h2><p>In the ETH study, generated files did help when the repository’s other documentation was removed. They mostly compensate for missing docs.</p><p>Augment found the worst results where a module was already buried under very large amounts of surrounding documentation.</p><p class='k'>Good documentation comes first. Agent files stay minimal and point to it.</p>"},
{t:"Designing for agent readers",h:"<h2>Designing for agent readers</h2><table><tr><th>Practice</th><th>Why</th></tr><tr><td>Short index pointing to focused files</td><td>Modular beats huge cross-cutting files</td></tr><tr><td>Rules, contracts and reasons</td><td>Not inferable from code</td></tr><tr><td>Pair every “don’t” with a “do instead”</td><td>Warning-only guidance tends to underperform</td></tr><tr><td>Stable IDs (C1, ADR-0003)</td><td>Precise references, checkable</td></tr><tr><td>Size to the system</td><td>Skip arc42 for tiny projects</td></tr></table>"},
{t:"Don’t and do instead",h:"<h2>Don’t and do instead</h2><table><tr><th>✗ Warning only</th><th>✓ With an alternative</th></tr><tr><td>Don’t call the provider API directly</td><td>Call it through the Payment Adapter</td></tr><tr><td>Don’t store card data</td><td>Use the provider-hosted payment page (C1)</td></tr><tr><td>Don’t retry without limits</td><td>Retry with backoff, up to 5 attempts</td></tr></table>"},
{t:"Example: a short agent index",h:"<h2>Example: a short agent index</h2><div class='xp' style='font-size:18px;line-height:1.4'># Doubles-to-Go: agent guide<br>Pre-order app for street food vendors. Architecture: docs/arc42.md<br><br>## Read first<br>- Constraints: docs/arc42.md#2 (C1–C5)<br>- Block responsibilities: docs/arc42.md#5<br>- Order Service contract: docs/contracts/place-order.md<br><br>## Rules<br>- All provider calls go through Payment Adapter (ADR-0003)<br>- Every write request carries an idempotency key<br>- No card data in our code (C1)<br><br>## Commands<br>- test: npm test · lint: npm run lint<br><br>About 20 lines. It points at the real documentation instead of repeating it.</div>"},
{t:"Stable IDs and checks",h:"<h2>Stable IDs and checks</h2><ul><li>Give constraints, ADRs, scenarios and risks stable IDs (C1, ADR-0003, Q4, R2)</li><li>Reference them from other sections and from code comments</li><li>A small script can check that every referenced ID exists and every ID is used</li></ul><p class='k'>IDs turn prose into something both people and tools can verify.</p>"},
{t:"Turn an invariant into a test",h:"<h2>Turn an invariant into a test (demo)</h2><ol><li>Pick an invariant from your contract</li><li>Write it in words: Given… when the same request is sent twice… then one order exists.</li><li>Ask an assistant for a test stub. You review it.</li><li>Add the test name to the contract as its verification.</li></ol>"},
{t:"The spec-driven ladder",h:"<h2>The spec-driven ladder</h2><ul><li><span class='k'>Spec-first:</span> a spec is written before coding, then may be discarded</li><li><span class='k'>Spec-anchored:</span> the spec is kept and evolves with the feature</li><li><span class='k'>Spec-as-source:</span> only the spec is edited, code is generated</li></ul><p class='m'>Tools such as GitHub Spec Kit, Kiro and Tessl sit at different rungs. The definitions are still in flux, and most examples are spec-first, so keeping specs current over time is the hard part.</p><p class='src'>Böckeler, martinfowler.com.</p>"},
{t:"Keep it honest: drift",h:"<h2>Keep it honest: drift</h2><p>Thoughtworks Radar, April 2026 (Assess): coding agents can accelerate drift from the intended architecture. Teams pair deterministic tools (ArchUnit, Spectral, Spring Modulith) with LLM evaluation, keep fixes small and add a verification loop.</p><p>Larsen and Moghaddam, June 2026 (arXiv:2606.13298, preprint): across 151 Java repositories, agent adoption grew code volume by about 12.8% while total architectural smells did not fall. The apparent drop in smell density was a dilution effect.</p><p class='k'>Documentation without enforcement decays.</p>"},
{t:"What to enforce, and how",h:"<h2>What to enforce, and how</h2><table><tr><th>Documented rule</th><th>Enforce with</th></tr><tr><td>Blocks only call allowed neighbours</td><td>An architecture test in CI</td></tr><tr><td>Idempotency keys on writes</td><td>A contract test</td></tr><tr><td>No card data stored</td><td>A scan in the pipeline</td></tr><tr><td>Every ID resolves</td><td>A documentation lint</td></tr></table><p class='m'>Use deterministic checks first. Use LLM review for what rules can’t express.</p>"},
{t:"An experiment for next month",h:"<h2>An experiment for next month</h2><p>Same small task, three arms:</p><ul><li><span class='k'>A</span> no docs</li><li><span class='k'>B</span> a short index (≤150 lines) plus two relevant contracts</li><li><span class='k'>C</span> the full arc42</li></ul><p>Measure success, steps, cost and rule violations.</p><p class='m'>Hypotheses from the literature: B ≥ A; C costs more than B; C may not beat B.</p>"},
{o:1,t:"Run it fairly",h:"<h2>Run it fairly</h2><ul><li>Same task, same model, same starting commit</li><li>Repeat each arm several times: agent runs vary</li><li>Define “success” before you look (tests pass, rules respected)</li><li>Track tokens, steps and review time</li><li>Report what you found, even if C wins</li></ul>"},
{p:"Part 15 · Close",t:"Part 15: Close",h:"<p class='m'>Part 15 · 16:35 to 17:00</p><h1>Close</h1><p>Check, share, plan.</p>"},
{e:8,t:"Assemble and check",h:"<h2>Assemble and check your skeleton (8 min)</h2><p>☐ All 12 headings present, even rough</p><p>☐ Every quality goal has a scenario with a number</p><p>☐ Every §5 block traces to a strategy or goal</p><p>☐ §6 participants match §5 names</p><p>☐ At least 1 ADR with an alternative and a negative consequence</p><p>☐ IDs (C1, ADR-…) referenced at least once elsewhere</p>"},
{e:7,t:"Gallery walk",h:"<h2>Gallery walk (7 min)</h2><p>Rotate once. Leave one sticky comment: one strength, one question.</p>"},
{e:5,t:"Retake the quiz and re-rate",h:"<h2>Retake the quiz and re-rate (5 min)</h2><p>Retake the 8 questions. Then rate yourself 1 to 5 on each outcome:</p><p class='k'>1 seen it · 2 with help · 3 light review · 4 independent · 5 can coach</p>"},
{t:"Key takeaways",h:"<h2>Key takeaways</h2><ul><li>Quality goals first, then strategy, then structure</li><li>Document what code can’t tell: boundaries, qualities, decisions, reasons</li><li>Numbers beat adjectives</li><li>Draft by hand, challenge with AI, decide as a human</li><li>Write for two readers, and enforce what you document</li></ul>"},
{t:"Your 30-day plan",h:"<h2>Your 30-day plan</h2><ul><li><span class='k'>Week 1:</span> finish §1 to §4 with your real team</li><li><span class='k'>Week 2:</span> §5 and §6, one contract per critical block</li><li><span class='k'>Week 3:</span> three ADRs, five scenarios, risks</li><li><span class='k'>Week 4:</span> run the agent experiment and share the results</li></ul>"},
{t:"Further reading",h:"<h2>Further reading</h2><p>arc42: docs.arc42.org · faq.arc42.org · examples.arc42.org · quality.arc42.org · C4 model: c4model.com · MADR: adr.github.io/madr · Mermaid: mermaid.js.org</p><p class='src'>Research cited: Gloaguen et al. (arXiv:2602.11988) · Shen and Tamkin, Anthropic (Jan 2026) · Cemri et al. (arXiv:2503.13657) · Sathvika et al. (arXiv:2603.21178) · arXiv:2604.03826 · Larsen and Moghaddam (arXiv:2606.13298) · Thoughtworks Radar (April 2026) · Böckeler on martinfowler.com</p>"},
{t:"Thank you",h:"<h1>Thank you</h1><p>Feedback: what to keep, what to cut, the most useful exercise</p><p>Share your skeleton with your team on Monday</p><p>Questions: peterdramsajan@gmail.com</p>"},
{p:"Appendix A · Quiz",t:"Quiz (8 questions)",h:"<h2>Quiz (8 questions)</h2><ol><li>Which section answers “what can’t we change?” → §2</li><li>Constraint vs decision? → A constraint is imposed and not negotiable. A decision is a choice we made.</li><li>A quality goal with no scenario is… → A wish. It can’t be tested.</li><li>What is a container in C4? → A runnable or deployable application or data store.</li><li>Which view shows interaction over time? → Runtime view (§6)</li><li>What belongs in an ADR? → One significant decision: context, options, decision, consequences.</li><li>Why limit top quality goals to 3 to 5? → You can’t maximise everything. Focus drives the architecture.</li><li>One reason AI-generated architecture text needs human review? → It may invent facts, contradict sections or miss implicit decisions.</li></ol>"},
{p:"Appendix B · Quick card",t:"Section quick card",h:"<h2>Section quick card</h2><table><tr><th>§</th><th>Ask yourself</th><th>Done when</th></tr><tr><td>1</td><td>Why does it exist, what matters most, who cares?</td><td>Numbered scenarios</td></tr><tr><td>2</td><td>Can we negotiate it?</td><td>Each passes the test</td></tr><tr><td>3</td><td>Who talks to us, through what?</td><td>All arrows labelled</td></tr><tr><td>4</td><td>How do we achieve each goal?</td><td>A neighbour can guess your architecture</td></tr><tr><td>5</td><td>What are the parts, and what do they promise?</td><td>5 to 9 blocks and 1 contract</td></tr><tr><td>6</td><td>How do parts interact when it matters?</td><td>Includes a failure branch</td></tr><tr><td>7</td><td>Where does each block run?</td><td>Mapping table complete</td></tr><tr><td>8</td><td>What repeats everywhere?</td><td>Each concept spans 2 or more blocks</td></tr><tr><td>9</td><td>Why this option?</td><td>2 or more options, 1 or more negative consequence</td></tr><tr><td>10</td><td>How good, measurably?</td><td>Numbers in every scenario</td></tr><tr><td>11</td><td>What could go wrong?</td><td>Mitigation and owner</td></tr><tr><td>12</td><td>What do words mean?</td><td>Each term defined once</td></tr></table>"},

function pw(){window.open(location.pathname+"?presenter#"+(i+1),"arc42-presenter","width=900,height=700")}
var rcd=null,rch=[],rst=null,rsrc=[],rac=null,rwasFs=false,rbusy=false;
function fsAsk(on){var el=document.getElementById("fsask");el.style.display=on?"block":"none";if(!on)return;
var h=function(){document.removeEventListener("pointerdown",h,true);document.removeEventListener("keydown",h,true);el.style.display="none";document.documentElement.requestFullscreen().then(function(){if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){wl=w}).catch(function(){})}).catch(function(){})};
document.addEventListener("pointerdown",h,true);document.addEventListener("keydown",h,true)}
function recUI(on){document.body.classList.toggle("recording",on);if(!on)document.body.classList.remove("idle");document.getElementById("b-rec").textContent=on?"Stop recording (R)":"Record (R)"}
async function recStart(){
  if(rbusy)return;rbusy=true;
  try{
    rwasFs=!!document.fullscreenElement;
    var ds=null,ms=null;
    try{ds=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:true,preferCurrentTab:true,selfBrowserSurface:"include",surfaceSwitching:"exclude"})}
    catch(e){console.warn("Screen capture cancelled:",e);return}
    var vt=ds.getVideoTracks()[0];
    try{if(window.CropTarget&&vt.cropTo&&vt.getSettings().displaySurface==="browser"){await vt.cropTo(await CropTarget.fromElement(document.getElementById("stage")))}}
    catch(e){console.warn("Recording the whole tab (region capture unavailable):",e)}
    try{ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}})}
    catch(e){console.warn("No microphone: recording without narration",e)}
    rac=new AudioContext();try{await rac.resume()}catch(e){}
    var dst=rac.createMediaStreamDestination();
    if(ms)rac.createMediaStreamSource(ms).connect(dst);
    if(ds.getAudioTracks().length)rac.createMediaStreamSource(new MediaStream(ds.getAudioTracks())).connect(dst);
    rsrc=[ds,ms];
    rst=new MediaStream([vt].concat(dst.stream.getAudioTracks()));
    var mt=['video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(function(t){return MediaRecorder.isTypeSupported(t)});
    rch=[];
    rcd=mt?new MediaRecorder(rst,{mimeType:mt,videoBitsPerSecond:3000000,audioBitsPerSecond:64000}):new MediaRecorder(rst);
    rcd.ondataavailable=function(e){if(e.data&&e.data.size)rch.push(e.data)};
    rcd.onstop=function(){
      var type=rcd.mimeType||mt||"video/webm",b=new Blob(rch,{type:type}),u=URL.createObjectURL(b),a=document.createElement("a");
      a.href=u;a.download="arc42-"+Date.now()+(type.indexOf("mp4")>-1?".mp4":".webm");document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},10000);rch=[];
      rsrc.forEach(function(s){if(s)s.getTracks().forEach(function(t){t.stop()})});rsrc=[];
      if(rac){rac.close();rac=null}
      fsAsk(false);recUI(false);rcd=null};
    vt.onended=function(){recStop()};
    rcd.start(1000);
    recUI(true);
    if(rwasFs&&!document.fullscreenElement){try{await document.documentElement.requestFullscreen()}catch(e){fsAsk(true)}}
    if(document.fullscreenElement)document.body.classList.add("idle");
  }finally{rbusy=false}
}
function recStop(){if(rcd&&rcd.state!=="inactive")rcd.stop()}
function recToggle(){document.body.classList.contains("recording")?recStop():recStart()}
document.addEventListener("keydown",function(e){if(e.metaKey||e.ctrlKey||e.altKey)return;var k=e.key;
if(k==="ArrowRight"||k==="ArrowDown"||k==="PageDown"||k===" "||k==="Enter"){e.preventDefault();go(i+1)}
else if(k==="ArrowLeft"||k==="ArrowUp"||k==="PageUp"||k==="Backspace"){e.preventDefault();go(i-1)}
else if(k==="Home")go(0);else if(k==="End")go(SL.length-1);
else if(k==="f"||k==="F")fs();else if(k==="o"||k==="O")tog("ov");else if(k==="n"||k==="N")tog("nt");
else if(k==="t"||k==="T")timer();else if(k==="e"||k==="E")cdown();else if(k==="s"||k==="S")skip();else if(k==="p"||k==="P")pw();else if(k==="r"||k==="R")recToggle();else if(k==="Escape"){document.body.classList.remove("ov","cd");if(cdt){clearInterval(cdt);cdt=null}}});
var sx=null;
document.addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",function(e){if(sx===null)return;var d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(i+(d<0?1:-1));sx=null});
var idle;function wake(){document.body.classList.remove("idle");clearTimeout(idle);if(document.fullscreenElement)idle=setTimeout(function(){document.body.classList.add("idle")},2500)}
document.addEventListener("mousemove",wake);
document.getElementById("b-prev").onclick=function(){go(i-1)};document.getElementById("b-next").onclick=function(){go(i+1)};
document.getElementById("b-ov").onclick=function(){tog("ov")};document.getElementById("b-nt").onclick=function(){tog("nt")};
document.getElementById("b-pr").onclick=pw;document.getElementById("b-fs").onclick=fs;document.getElementById("b-tm").onclick=timer;document.getElementById("b-ex").onclick=cdown;document.getElementById("b-sk").onclick=skip;
document.getElementById("b-rec").onclick=recToggle;
if(pres)document.body.classList.add("pres","nt");
var h=parseInt((location.hash||"").slice(1),10);if(h)i=Math.max(0,Math.min(SL.length-1,h-1));
render();
</script>
